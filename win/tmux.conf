# tmux settings for `cs` only (its own server, -L claudestack). Your ~/.tmux.conf is not read.
set -g status off                 # the tab looks like plain Claude
set -s escape-time 0              # Esc reaches Claude at once
set -s extended-keys on           # Shift+Enter and other modified keys reach Claude
set -as terminal-features 'xterm*:extkeys:RGB'
set -g default-terminal "tmux-256color"
set -g focus-events on
set -g history-limit 50000
# The wheel scrolls tmux's history, and a mouse selection is copied to the Windows clipboard
# through the terminal (OSC 52). Hold Shift to select with Windows Terminal instead.
set -g mouse on
set -s set-clipboard on
# The tab title keeps Claude's own title and adds the tag the app looks for.
set -g set-titles on
set -g set-titles-string '#{pane_title} [#{session_name}]'
